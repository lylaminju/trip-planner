<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>TripGlance Sign In Mockup</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&family=IBM+Plex+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    :root {
      --accent: #0d9488;
      --accent-faint: rgba(13, 148, 136, 0.08);
      --ink: #1a1a1a;
      --muted: #57534e;
      --subtle: #78716c;
      --quiet: #a8a29e;
      --paper: #fafaf8;
      --surface: #ffffff;
      --surface-alt: #f6f4ef;
      --line: #ece9e2;
      --line-strong: #e0ddd4;
      --page-max: 1160px;
      --mono: "IBM Plex Mono", ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace;
      --sans: "IBM Plex Sans", -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    }

    * {
      box-sizing: border-box;
    }

    html {
      background: var(--paper);
      scrollbar-gutter: stable;
    }

    body {
      margin: 0;
      min-height: 100vh;
      background: var(--paper);
      color: var(--ink);
      font-family: var(--sans);
      -webkit-font-smoothing: antialiased;
      text-rendering: optimizeLegibility;
    }

    a {
      color: inherit;
    }

    .page {
      min-height: 100vh;
      display: flex;
      flex-direction: column;
    }

    .site-header {
      width: 100%;
      max-width: var(--page-max);
      margin: 0 auto;
      padding: 18px 24px;
      display: flex;
      align-items: center;
      gap: 18px;
    }

    .brand {
      margin-right: auto;
      display: inline-flex;
      align-items: center;
      gap: 11px;
      color: var(--ink);
      text-decoration: none;
    }

    .brand-logo {
      width: 30px;
      height: 30px;
      flex: 0 0 auto;
      border-radius: 9px;
      background: var(--accent);
      box-shadow: 0 2px 8px -2px rgba(13, 148, 136, 0.4);
    }

    .brand-logo rect {
      fill: var(--accent);
    }

    .brand-logo path {
      fill: none;
      stroke: #ffffff;
      stroke-linecap: round;
      stroke-linejoin: round;
      stroke-width: 4;
    }

    .brand-name {
      font-size: 17px;
      font-weight: 600;
      letter-spacing: 0;
    }

    .nav-actions {
      display: flex;
      align-items: center;
      gap: 10px;
      flex-wrap: wrap;
      justify-content: flex-end;
    }

    .nav-link {
      color: var(--muted);
      font-size: 14px;
      font-weight: 500;
      text-decoration: none;
      border-radius: 9px;
    }

    .nav-link {
      padding: 9px 12px;
    }

    .nav-link:hover {
      color: var(--ink);
      background: var(--surface-alt);
    }

    .invite-button {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      min-height: 38px;
      padding: 0 16px;
      border-radius: 10px;
      background: var(--accent);
      color: #ffffff;
      font-size: 14px;
      font-weight: 600;
      text-decoration: none;
      box-shadow: 0 8px 22px -12px rgba(13, 148, 136, 0.7);
    }

    .invite-button:hover {
      filter: brightness(0.96);
    }

    .auth-shell {
      width: 100%;
      max-width: 520px;
      margin: 0 auto;
      padding: 76px 24px 52px;
      display: flex;
      justify-content: center;
      align-items: center;
      flex: 1;
    }

    .auth-card {
      width: 100%;
      background: var(--surface);
      border: 1px solid var(--line);
      border-radius: 16px;
      padding: 36px;
      box-shadow: 0 1px 2px rgba(28, 25, 23, 0.04);
    }

    h1 {
      margin: 0;
      font-size: 40px;
      line-height: 1.08;
      font-weight: 600;
      letter-spacing: 0;
    }

    .intro {
      margin: 14px 0 0;
      color: var(--muted);
      font-size: 16px;
      line-height: 1.58;
    }

    .signin-form {
      margin-top: 30px;
      display: grid;
      gap: 18px;
    }

    .field {
      display: grid;
      gap: 8px;
    }

    .field span {
      color: var(--ink);
      font-size: 14px;
      font-weight: 600;
    }

    .field input {
      width: 100%;
      height: 48px;
      border: 1px solid var(--line-strong);
      border-radius: 10px;
      background: var(--surface);
      color: var(--ink);
      font: inherit;
      font-size: 15px;
      padding: 0 14px;
      outline: none;
      transition: border-color 0.15s ease, box-shadow 0.15s ease, background 0.15s ease;
    }

    .field input::placeholder {
      color: var(--quiet);
    }

    .field input:focus {
      border-color: var(--accent);
      box-shadow: 0 0 0 4px var(--accent-faint);
    }

    .primary-button {
      width: 100%;
      height: 48px;
      border: 0;
      border-radius: 11px;
      background: var(--accent);
      color: #ffffff;
      cursor: pointer;
      font: inherit;
      font-size: 15px;
      font-weight: 600;
      box-shadow: 0 10px 26px -14px rgba(13, 148, 136, 0.8);
    }

    .primary-button:hover {
      filter: brightness(0.96);
    }

    .primary-button:focus-visible {
      outline: 4px solid var(--accent-faint);
      outline-offset: 2px;
    }

    .access-row {
      margin-top: 22px;
      padding-top: 20px;
      border-top: 1px solid var(--line);
      color: var(--subtle);
      font-size: 14px;
      line-height: 1.5;
    }

    .access-row a {
      color: var(--accent);
      font-weight: 600;
      text-decoration: none;
    }

    .access-row a:hover {
      text-decoration: underline;
      text-underline-offset: 3px;
    }

    .site-footer {
      width: 100%;
      max-width: var(--page-max);
      margin: 0 auto;
      padding: 30px 24px 50px;
      display: flex;
      align-items: center;
      border-top: 1px solid var(--line);
      color: #b8b2a8;
      font-family: var(--mono);
      font-size: 11.5px;
    }

    @media (max-width: 880px) {
      .auth-shell {
        padding-top: 34px;
      }
    }

    @media (max-width: 640px) {
      .site-header {
        align-items: flex-start;
        padding: 16px;
      }

      .nav-actions {
        gap: 8px;
      }

      .nav-link {
        display: none;
      }

      .auth-shell {
        padding: 18px 16px 32px;
      }

      .auth-card {
        border-radius: 16px;
        padding: 24px;
      }

      h1 {
        font-size: 34px;
      }

      .site-footer {
        padding: 24px 16px 34px;
      }
    }
  </style>
</head>
<body>
  <div class="page">
    <header class="site-header">
      <a class="brand" href="./tripglance-showcase-landing.html" aria-label="TripGlance overview">
        <svg class="brand-logo" viewBox="0 0 64 64" aria-hidden="true" focusable="false">
          <rect width="64" height="64" rx="14"></rect>
          <path d="M14 24L26 18L38 24L50 18V48L38 54L26 48L14 54V24Z"></path>
          <path d="M26 18V48M38 24V54"></path>
        </svg>
        <span class="brand-name">TripGlance</span>
      </a>
      <nav class="nav-actions" aria-label="Primary">
        <a class="nav-link" href="./tripglance-showcase-landing.html">Overview</a>
        <a class="invite-button" href="mailto:mjuudev@gmail.com?subject=TripGlance%20access%20request&amp;body=Hi%2C%20I%20would%20like%20to%20request%20access%20to%20TripGlance.">Request invite</a>
      </nav>
    </header>

    <main class="auth-shell">
      <section class="auth-card" aria-labelledby="signin-title">
        <h1 id="signin-title">Sign in</h1>
        <p class="intro">Use the email tied to your invite to continue to your saved trips and day-by-day plans.</p>

        <form class="signin-form" action="#" method="post">
          <label class="field">
            <span>Email</span>
            <input type="email" name="email" placeholder="you@example.com" autocomplete="email" required>
          </label>

          <label class="field">
            <span>Password</span>
            <input type="password" name="password" placeholder="Enter your password" autocomplete="current-password" required>
          </label>

          <button class="primary-button" type="submit">Sign in</button>
        </form>

        <p class="access-row">
          Need access?
          <a href="mailto:mjuudev@gmail.com?subject=TripGlance%20access%20request&amp;body=Hi%2C%20I%20would%20like%20to%20request%20access%20to%20TripGlance.">Request an invite</a>
          and we will follow up.
        </p>
      </section>

    </main>

    <footer class="site-footer">
      <span>&copy; 2026 TripGlance &middot; Not affiliated with Google Maps</span>
    </footer>
  </div>
</body>
</html>
